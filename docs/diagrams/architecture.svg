<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="592" viewBox="0 0 1120 592" role="img" aria-labelledby="title desc">
  <title id="title">LorR · Diagramme de composants</title>
  <desc id="desc">Le navigateur envoie un lien invité à LorR. Le serveur PHP interroge Hyperplanning et conserve un cache des horaires. Les préférences restent dans le navigateur. SQLite conserve les codes courts et les statistiques. La page Soutenir lit aussi les chiffres publics de GitHub.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#e2d9ca"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="m2 2 8 4-8 4" fill="none" stroke="#202124" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { fill:#202124; font-family:system-ui,sans-serif }
      .box,.shadow { stroke:#202124; stroke-width:2.5 }
      .shadow { fill:#202124 }
      .headline { font-size:36px; font-weight:850; letter-spacing:-.9px }
      .label { font-size:22px; font-weight:760 }
      .body { font-size:15px }
      .small { font-size:13px; font-weight:680 }
      .file { font:14px ui-monospace,monospace }
      .line { stroke:#202124; stroke-width:2.4; fill:none; marker-end:url(#arrow) }
    </style>
  </defs>
  <rect x="1.5" y="1.5" width="1117" height="589" rx="24" fill="#fcf8ef" stroke="#202124" stroke-width="3"/>
  <path d="M24 112h1072v456H24z" fill="url(#dots)"/>
  <text x="40" y="39" class="small">DIAGRAMME DE COMPOSANTS</text>
  <text x="40" y="81" class="headline">LorR, du navigateur aux horaires</text>
  <g transform="translate(1022 34) rotate(8)"><rect x="3" y="3" width="49" height="49" rx="9" fill="#202124"/><rect width="49" height="49" rx="9" fill="#ffcc39" class="box"/><path d="m25 9-12 19h10l-2 12 15-20H25z" fill="#202124"/></g>

  <path class="line" d="M294 229H426"/>
  <path class="line" d="M694 218H828"/>
  <path class="line" d="M694 279H757V364H828"/>
  <path class="line" d="M168 327V430"/>
  <path class="line" d="M565 327V430"/>
  <text x="361" y="214" class="small" text-anchor="middle">HTTPS</text>
  <text x="762" y="201" class="small" text-anchor="middle">Session invitée</text>
  <text x="735" y="265" class="small" text-anchor="middle">API publique</text>

  <g>
    <rect x="46" y="145" width="246" height="179" rx="15" class="shadow"/>
    <rect x="41" y="140" width="246" height="179" rx="15" fill="#aeedce" class="box"/>
    <text x="59" y="169" class="small">« composant »</text>
    <text x="59" y="202" class="label">Navigateur</text>
    <path d="M59 218h208" stroke="#202124" stroke-opacity=".35"/>
    <text x="59" y="247" class="file">scripts/planning.js</text>
    <text x="59" y="274" class="body">Choix, calendrier, partage</text>
    <text x="59" y="295" class="body">et export ICS</text>
  </g>
  <g>
    <rect x="441" y="145" width="246" height="179" rx="15" class="shadow"/>
    <rect x="436" y="140" width="246" height="179" rx="15" fill="#d0b1fa" class="box"/>
    <text x="454" y="169" class="small">« composant »</text>
    <text x="454" y="202" class="label">LorR sur LWS</text>
    <path d="M454 218h208" stroke="#202124" stroke-opacity=".35"/>
    <text x="454" y="247" class="file">index.php · Apache</text>
    <text x="454" y="274" class="body">Pages, API et lecteur invité</text>
    <text x="454" y="295" class="body">PHP avec cURL et OpenSSL</text>
  </g>
  <g>
    <rect x="843" y="145" width="233" height="131" rx="15" class="shadow"/>
    <rect x="838" y="140" width="233" height="131" rx="15" fill="#dceafd" class="box"/>
    <text x="856" y="169" class="small">« système externe »</text>
    <text x="856" y="200" class="label">Hyperplanning</text>
    <text x="856" y="231" class="file">/invite</text>
    <text x="856" y="252" class="body">Formations et horaires</text>
  </g>
  <g>
    <rect x="843" y="330" width="233" height="94" rx="15" class="shadow"/>
    <rect x="838" y="325" width="233" height="94" rx="15" fill="#fff0bc" class="box"/>
    <text x="856" y="357" class="label">GitHub</text>
    <text x="856" y="388" class="body">Étoiles, forks et abonnés</text>
  </g>
  <g>
    <rect x="46" y="448" width="246" height="99" rx="15" class="shadow"/>
    <rect x="41" y="443" width="246" height="99" rx="15" fill="#fffdf9" class="box"/>
    <text x="59" y="476" class="label">Sur l’appareil</text>
    <text x="59" y="502" class="body">Brouillon et planning enregistré</text>
    <text x="59" y="523" class="body">Cache web et horaires en cache</text>
  </g>
  <g>
    <rect x="441" y="448" width="322" height="99" rx="15" class="shadow"/>
    <rect x="436" y="443" width="322" height="99" rx="15" fill="#fffdf9" class="box"/>
    <text x="454" y="476" class="label">Sur le serveur</text>
    <text x="454" y="502" class="body">Fichiers temporaires pour les horaires</text>
    <text x="454" y="523" class="body">SQLite pour les liens courts et les compteurs</text>
  </g>
</svg>
